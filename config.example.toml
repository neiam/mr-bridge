# Example configuration for mr-bridge
# This file demonstrates all available configuration options

# Loop prevention (seconds). 0 = off (default). Set > 0 when bridging overlapping
# topics in both directions (e.g. direction = "wherever" on "#"): a forwarded
# message's echo is dropped within this window instead of being forwarded again.
# Keep it short; identical topic+payload messages repeated within the window are
# de-duplicated. Must be a top-level key (before the [near]/[far]/[[rules]] tables).
# dedup_window_secs = 10

# Near broker configuration (local/internal broker)
[near]
host = "localhost"
port = 1883
# Optional authentication
# username = "user1"
# password = "pass1"
# Optional client ID (will be auto-generated if not specified)
# client_id = "mr-bridge-near"
# Optional max MQTT packet size in bytes (default 5 MiB). Raise if you bridge
# very large retained payloads (e.g. Zigbee2MQTT bridge/definitions).
# max_packet_size = 5242880

# Far broker configuration (remote/external broker)
[far]
host = "mqtt.example.com"
port = 1883
# Optional authentication
# username = "user2"
# password = "pass2"
# Optional client ID (will be auto-generated if not specified)
# client_id = "mr-bridge-far"

# Bridge rules - define which topics to bridge and in which direction
[[rules]]
# Forward all sensor data from near to far
topic = "sensors/#"
direction = "near_to_far"
logging = true
qos = 1

[[rules]]
# Forward commands from far to near
topic = "commands/#"
direction = "far_to_near"
logging = true
qos = 1

[[rules]]
# Bidirectional bridging for status updates
topic = "status/+"
direction = "wherever"
logging = false
qos = 0

[[rules]]
# Bridge specific temperature topic
topic = "home/living/temperature"
direction = "near_to_far"
logging = true
qos = 0

[[rules]]
# Bridge all home automation topics bidirectionally
topic = "home/+/control"
direction = "wherever"
logging = true
qos = 1
